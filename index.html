<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatKu</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #075e54;
    color: white;
    padding: 18px;
    font-size: 21px;
    font-weight: bold;
}

h3 {
    margin: 15px;
}

#pengguna {
    background: white;
}

.user {
    padding: 15px;
    border-bottom: 1px solid #ddd;
    font-size: 17px;
}

.avatar {
    display: inline-flex;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #075e54;
    color: white;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    font-weight: bold;
}

#namaSaya {
    padding: 15px;
    background: #d9fdd3;
}
</style>
</head>

<body>

<header>
    💬 ChatKu
</header>

<div id="namaSaya"></div>

<h3>Pengguna ChatKu</h3>

<div id="pengguna"></div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {
    apiKey: "AIzaSyBbJ42S4TJaZhc0z3bzOqdy9m71KwTou-c",
    authDomain: "keinginan-dia.firebaseapp.com",
    databaseURL: "https://keinginan-dia-default-rtdb.firebaseio.com",
    projectId: "keinginan-dia",
    storageBucket: "keinginan-dia.firebasestorage.app",
    messagingSenderId: "687114270810",
    appId: "1:687114270810:web:356427bb7152f272b28063"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* NAMA */

let nama = localStorage.getItem("nama");

if (!nama) {

    nama = prompt("Masukkan nama kamu:");

    if (!nama || nama.trim() === "") {
        nama = "Pengguna";
    }

    nama = nama.trim();

    localStorage.setItem("nama", nama);
}


/* TAMPILKAN NAMA SENDIRI */

document.getElementById("namaSaya").textContent =
"👤 Kamu: " + nama;


/* DAFTARKAN USER KE FIREBASE */

const userRef = ref(
    db,
    "pengguna/" + nama
);

set(userRef, {
    nama: nama,
    online: true
});


/* AMBIL DAFTAR USER */

const penggunaRef = ref(db, "pengguna");

const daftar = document.getElementById("pengguna");

onValue(penggunaRef, function(snapshot) {

    daftar.innerHTML = "";

    snapshot.forEach(function(data) {

        const user = data.val();

        if (user.nama === nama) {
            return;
        }

        const div = document.createElement("div");

        div.className = "user";

        const huruf = user.nama
            .charAt(0)
            .toUpperCase();

        div.innerHTML = `
            <span class="avatar">${huruf}</span>
            ${user.nama}
        `;

        daftar.appendChild(div);

    });

});

</script>

</body>
</html>
